name: CARVIO public browser smoke
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  public-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the pull request build
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/carvio-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/find > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/carvio-server.log
          exit 1
      - name: Check candidate desktop and mobile experience (read-only)
        run: node tests/browser-smoke.mjs
        env:
          CARVIO_BASE_URL: http://127.0.0.1:3000/?workspace=1
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carvio-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 3
