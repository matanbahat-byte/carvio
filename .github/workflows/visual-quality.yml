name: CARVIO visual quality
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: candidate-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://cloud-fixture.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: isolated-fixture-anon-key
      - run: npm install --no-save --package-lock=false playwright@1.58.2 @electric-sql/pglite@0.5.17
      - run: npx playwright install --with-deps chromium
      - name: Verify isolated database ownership and stale writes
        run: CARVIO_QA_NODE_MODULES="$PWD/node_modules" node tests/cloud-sync-database.mjs
      - name: Verify candidate desktop, mobile, RTL and LTR
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3120 > /tmp/carvio-visual-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<100;i++){try{if((await fetch("http://127.0.0.1:3120/find")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,200));}process.exit(1)'
          node tests/resume-search-home-browser.mjs
          node tests/public-search-handoff-browser.mjs
          node tests/visual-quality.mjs
          CARVIO_BASE_URL=http://127.0.0.1:3120 node tests/cloud-sync-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carvio-visual-quality
          path: |
            artifacts/visual/after/
            artifacts/cloud-sync/
            artifacts/handoff/
            artifacts/resume-search/
          retention-days: 7
