name: CARVIO Job Radar daily report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
      timezone: Asia/Jerusalem
permissions:
  contents: read
concurrency:
  group: carvio-job-radar-report
  cancel-in-progress: false
jobs:
  report:
    if: vars.CARVIO_RADAR_REPORTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Persist anonymous aggregate reports only
        run: node scripts/job-radar-report.mjs --persist
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_DEV_SUPABASE_URL }}
          RADAR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_DEV_SUPABASE_SERVICE_ROLE_KEY }}
